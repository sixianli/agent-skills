interface:
  display_name: "CodeBuddy Orchestration"
  short_description: "Delegate scoped coding tasks to the CodeBuddy CLI and verify them"
  default_prompt: "Use $codebuddy-orchestration to hand this scoped task to the CodeBuddy CLI in an isolated worktree, then check scope, re-run acceptance and land the change unstaged."
policy:
  allow_implicit_invocation: true
